<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老挝语点读课本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;600&display=swap">
<style>
/* 布局：手机单栏。顶部固定课程条，下面是一课的词汇、句子、对话，每行点一下就读。 */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#16213a; --muted:#5d6880; --line:#dde2ea;
  --accent:#1f4fa3; --accent-ink:#ffffff; --mark:#f2a91c; --mark-soft:#fdf1d3;
  --lao:"Noto Sans Lao Looped","Noto Sans Lao","Phetsarath OT","Lao Sangam MN",sans-serif;
  --body:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1524; --surface:#182036; --ink:#e9edf6; --muted:#9aa5bd; --line:#2a3552;
    --accent:#8fb2ff; --accent-ink:#0f1524; --mark:#f5b83a; --mark-soft:#3a3118; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1524; --surface:#182036; --ink:#e9edf6; --muted:#9aa5bd; --line:#2a3552;
  --accent:#8fb2ff; --accent-ink:#0f1524; --mark:#f5b83a; --mark-soft:#3a3118; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 8px}
.bar{display:flex;gap:8px;align-items:center}
.bar h1{font-size:17px;margin:0;flex:none;font-weight:700}
#q{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 2px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
.chip[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px}
.tog[aria-pressed="true"]{background:var(--mark-soft);border-color:var(--mark)}
#status{font-size:13px;color:var(--muted);margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
#status.warn{border-color:var(--mark);background:var(--mark-soft);color:var(--ink)}

.lesson-head{padding:22px 0 6px}
.lesson-head .no{font-size:13px;color:var(--muted);letter-spacing:.04em}
.lesson-head h2{margin:2px 0 0;font-family:var(--lao);font-size:26px;line-height:1.5;font-weight:600;text-wrap:balance}
.lesson-head p{margin:2px 0 0;font-size:17px}
.lesson-head .rom{color:var(--muted);font-size:14px}

section.sec{margin:18px 0 0}
.sec-head{display:flex;align-items:baseline;gap:8px;justify-content:space-between;padding:0 2px 8px}
.sec-head h3{margin:0;font-size:15px;font-weight:700}
.sec-head .sub{font-family:var(--lao);font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.playall{flex:none;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:4px 12px;font-size:13px}
.playall.on{background:var(--accent);color:var(--accent-ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.playing{background:var(--mark-soft);box-shadow:inset 3px 0 0 var(--mark)}
.who{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:5px;background:var(--bg);border:1px solid var(--line)}
.who.b{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot{width:0}
.txt{min-width:0}
.lo{font-family:var(--lao);font-size:21px;line-height:1.65;overflow-wrap:anywhere}
.rm{font-size:13.5px;color:var(--accent);overflow-wrap:anywhere}
.zh{font-size:15px;color:var(--ink);overflow-wrap:anywhere}
body.hide-zh .zh:not(.show){color:transparent;background:var(--line);border-radius:6px;user-select:none}
.spk{border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent);margin-top:1px}
.spk svg{width:20px;height:20px}
.cpy{border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);margin-top:1px}
.cpy svg{width:19px;height:19px}
.lo{-webkit-user-select:text;user-select:text}
a.tog{text-decoration:none;color:var(--accent);border-color:var(--accent)}
#status a{color:var(--accent);font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
#manual{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:2px solid var(--mark);padding:14px 16px 20px;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
#manual[hidden]{display:none}
#manual p{margin:0 0 8px;font-size:14px}
#manual textarea{width:100%;font-family:var(--lao);font-size:20px;line-height:1.6;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.m-act{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
body.no-audio .spk, body.no-audio .playall{opacity:.35}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0;padding:12px 14px 12px 32px;font-size:15px}
.notes li+li{margin-top:6px}
.notes .l{font-family:var(--lao)}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.res-h{font-size:13px;color:var(--muted);margin:18px 2px 8px}
footer{color:var(--muted);font-size:12.5px;padding:28px 0 40px}
@media (prefers-reduced-motion: no-preference){.row{transition:background .15s}}
</style>
</head>

 {t:"p", h:"常用句", items:[

  ["ຍົນໄປຄຸນມິງອອກຈັກໂມງ?","去昆明的飞机几点起飞？","nyon pai khun-ming awk jak moong?"],
  ["ຂໍເຊັກອິນ. ນີ້ແມ່ນໜັງສືຜ່ານແດນ.","我要办理登机，这是我的护照。","khaw sek-in. nii maen nang-sue phaan-daen."],

 {t:"d", h:"对话：办理登机", sub:"ເຊັກອິນ", items:[

  ["B","ຂໍເບິ່ງໜັງສືຜ່ານແດນແດ່.","请出示护照。","khaw boeng nang-sue phaan-daen dae."],
  ["A","ນີ້ເດີ້. ຂໍບ່ອນນັ່ງຕິດປ່ອງຢ້ຽມແດ່.","给您。请给我靠窗的座位。","nii doe. khaw bawn-nang tit pawng-yiam dae."],

 {t:"n", h:"小贴士", notes:[

  "ໃບ（bai）是票、卡、包等的量词：ປີ້ໜຶ່ງໃບ（一张票）、ກະເປົາໜຶ່ງໃບ（一件行李）。",
  "国际航班请提前到机场；入境时可能被问 ມາທ່ອງທ່ຽວບໍ？（来旅游吗？）"]}

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var view=$("#view"), chips=$("#chips"), statusEl=$("#status"), q=$("#q");
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var rate=store.get("lo-rate")==="slow"?0.7:1;
var SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
var CPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
var YUN='<a href="https://yuntrans.vip/#/guestTranslation" target="_blank" rel="noopener">云岭翻译</a>';
var toastEl=$("#toast"), toastT=0;
function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove("on")},2200)}
function showManual(t){
  var box=$("#manual"); $("#manual-t").value=t; box.hidden=false;
  try{var ta=$("#manual-t");ta.focus();ta.setSelectionRange(0,t.length)}catch(e){}
}
function syncCopy(t){
  try{
    var ta=document.createElement("textarea"); ta.value=t; ta.contentEditable="true"; ta.readOnly=false;
    ta.style.cssText="position:fixed;top:40%;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;font-size:16px";
    document.body.appendChild(ta);
    var r=document.createRange(); r.selectNodeContents(ta);
    var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    ta.setSelectionRange(0,999999);
    var ok=document.execCommand("copy");
    sel.removeAllRanges(); document.body.removeChild(ta);
    return !!ok;
  }catch(e){return false}
}
function copyText(t){
  if(syncCopy(t)){toast("已复制，切到云岭翻译 App 粘贴收听");return}
  var done=false;
  function fail(){ if(done)return; done=true; showManual(t) }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ if(done)return; done=true; toast("已复制，切到云岭翻译 App 粘贴收听") },fail);
      setTimeout(fail,1200); return;
    }
  }catch(e){}
  fail();
}
function noAudioMsg(){setStatus("这台设备播放不了语音：iPhone 和 iPad 上的所有浏览器（包括 Chrome）以及 Claude 手机 App 都不支持朗读。请在电脑上用 Chrome 打开这个页面来听。文字内容不受影响。",true)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sayText(lo,say){return (say||lo).replace(/\s*\/\s*/g,", ").replace(/\.\.\./g,"")}

/* ---------- 渲染 ---------- */
function rowHTML(kind,it){
  var who=kind==="d"?it[0]:null, o=kind==="d"?1:0;
  var lo=it[o], zh=it[o+1], rm=it[o+2], say=it[o+3];
  return '<div class="row" data-say="'+esc(sayText(lo,say))+'">'+
    (who?'<span class="who '+(who==="B"?"b":"")+'">'+who+'</span>':'<span class="dot"></span>')+
    '<div class="txt"><div class="lo" lang="lo">'+esc(lo)+'</div>'+(rm?'<div class="rm">'+esc(rm)+'</div>':'')+
    '<div class="zh">'+esc(zh)+'</div></div>'+
    '<button class="spk" type="button" aria-label="朗读">'+SPK+'</button>'+'</div>';
}
function lessonHTML(l){
  var h='<div class="lesson-head"><div class="no">第 '+l.n+' 课 · <span lang="lo" style="font-family:var(--lao)">ບົດທີ '+l.n+'</span></div>'+
    '<h2 lang="lo">'+esc(l.lo)+'</h2><p>'+esc(l.zh)+(l.rom?' <span class="rom">'+esc(l.rom)+'</span>':'')+'</p></div>';
  l.secs.forEach(function(s){
    h+='<section class="sec"><div class="sec-head"><h3>'+esc(s.h)+(s.sub?'<span class="sub" lang="lo">'+esc(s.sub)+'</span>':'')+'</h3>'+
      (s.t!=="n"?'<button class="playall" type="button">连续播放</button>':'')+'</div>';
    if(s.t==="n"){h+='<ol class="notes">'+s.notes.map(function(n){return '<li>'+esc(n).replace(/([຀-໿][຀-໿\-]*)/g,'<span class="l" lang="lo">$1</span>')+'</li>'}).join("")+'</ol>'}
    else{h+='<div class="list">'+s.items.map(function(it){return rowHTML(s.t,it)}).join("")+'</div>'}
    h+='</section>';
  });
  return h;
}
var current=null;
function showLesson(n){
  var l=LESSONS.filter(function(x){return x.n===n})[0]||LESSONS[0];
  current=l.n; stopAll(); view.innerHTML=lessonHTML(l);
  Array.prototype.forEach.call(chips.children,function(c){
    var on=+c.dataset.n===l.n; c.setAttribute("aria-current",on?"true":"false");
    if(on&&c.scrollIntoView)c.scrollIntoView({block:"nearest",inline:"center"});
  });
  store.set("lo-last",String(l.n));
}
function search(term){
  stopAll(); term=term.trim().toLowerCase();
  var h="",count=0;
  LESSONS.forEach(function(l){
    var rows="";
    l.secs.forEach(function(s){ if(s.t==="n")return;
      s.items.forEach(function(it){ if(it.join(" ").toLowerCase().indexOf(term)>=0){rows+=rowHTML(s.t,it);count++} });
    });
    if(rows)h+='<div class="res-h">第 '+l.n+' 课 · '+esc(l.zh)+'</div><div class="list">'+rows+'</div>';
  });
  view.innerHTML=count?h:'<p class="empty">没有找到“'+esc(term)+'”。换个词试试，中文、老挝文、拼读都可以搜。</p>';
}
LESSONS.forEach(function(l){
  var b=document.createElement("button"); b.className="chip"; b.type="button"; b.dataset.n=l.n;
  b.innerHTML="<b>"+l.n+"</b> "+esc(l.zh);
  b.addEventListener("click",function(){q.value="";location.hash="l"+l.n;showLesson(l.n);window.scrollTo(0,0)});
  chips.appendChild(b);
});
function fromHash(){var m=/^#l(\d+)$/.exec(location.hash);return m?+m[1]:null}
window.addEventListener("hashchange",function(){var n=fromHash();if(n&&n!==current&&!q.value)showLesson(n)});
q.addEventListener("input",function(){ if(q.value.trim())search(q.value); else showLesson(current) });

/* ---------- 语音 ---------- */
var engine=null, token=0, claudeTts=null, loVoice=null, playingAll=null;
function setStatus(msg,warn){statusEl.textContent=msg;statusEl.className=warn?"warn":""}
function refreshEngine(){
  if(loVoice){engine="device";setStatus("语音：这台设备自带的老挝语语音（"+loVoice.name+"）。点任意一行即可朗读。")}
  else if(claudeTts){engine="claude";setStatus("语音：Claude 朗读。它的老挝语发音没有经过核对，请对照拼读一起听。")}
  else{engine=null}
  document.body.classList.toggle("no-audio",!engine);
}
function findVoice(){
  try{
    var vs=window.speechSynthesis?speechSynthesis.getVoices():[];
    for(var i=0;i<vs.length;i++){ if(/^lo([-_]|$)/i.test(vs[i].lang)){loVoice=vs[i];break} }
  }catch(e){}
  refreshEngine();
}
function initClaude(tries){
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      window.claude.use("tts").then(function(t){ if(t){claudeTts=t;refreshEngine()} },function(){});
      return;
    }
  }catch(e){}
  if(tries>0)setTimeout(function(){initClaude(tries-1)},500);
}
findVoice();
try{ if(window.speechSynthesis)speechSynthesis.addEventListener("voiceschanged",findVoice) }catch(e){}
initClaude(8);
setTimeout(function(){
  if(!engine)noAudioMsg();
},3000);

function speakOne(text){
  if(engine==="device"){
    return new Promise(function(res,rej){
      try{
        var u=new SpeechSynthesisUtterance(text); u.voice=loVoice; u.lang=loVoice.lang; u.rate=rate;
        u.onend=function(){res()}; u.onerror=function(e){rej(e)};
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      }catch(e){rej(e)}
    });
  }
  if(engine==="claude"){ return claudeTts.speak(text,{language:"lo",rate:rate}) }
  return Promise.reject({code:"no_engine"});
}
function stopAll(){
  token++; playingAll=null;
  try{ if(window.speechSynthesis)speechSynthesis.cancel() }catch(e){}
  try{ if(claudeTts)claudeTts.stop() }catch(e){}
  clearMarks();
}
function clearMarks(){
  Array.prototype.forEach.call(document.querySelectorAll(".row.playing"),function(r){r.classList.remove("playing")});
  Array.prototype.forEach.call(document.querySelectorAll(".playall.on"),function(b){b.classList.remove("on");b.textContent="连续播放"});
}
function onFail(e){
  var c=e&&e.code;
  if(c==="not_granted"){claudeTts=null;refreshEngine();setStatus("朗读功能已被关闭，无法播放。",true)}
  else if(c==="rate_limited"){setStatus("朗读太频繁，请等几秒再点。",true)}
  else if(c==="no_engine"){noAudioMsg()}
}
function playRows(rows,btn){
  stopAll(); var my=token;
  if(btn){playingAll=btn;btn.classList.add("on");btn.textContent="停止"}
  var i=0;
  function next(){
    if(my!==token)return;
    if(i>=rows.length){clearMarks();playingAll=null;return}
    var r=rows[i++];
    Array.prototype.forEach.call(document.querySelectorAll(".row.playing"),function(x){x.classList.remove("playing")});
    r.classList.add("playing");
    if(btn&&r.scrollIntoView)r.scrollIntoView({block:"nearest",behavior:"smooth"});
    speakOne(r.dataset.say).then(function(){
      if(my!==token)return;
      if(rows.length>1)setTimeout(next,450); else next();
    },function(e){ if(my!==token)return; clearMarks(); playingAll=null; onFail(e) });
  }
  next();
}
view.addEventListener("click",function(ev){
  var t=ev.target;
  var pa=t.closest(".playall");
  if(pa){ if(pa===playingAll){stopAll();return}
    playRows(Array.prototype.slice.call(pa.closest(".sec").querySelectorAll(".row")),pa); return }
  var zh=t.closest(".zh");
  if(zh&&document.body.classList.contains("hide-zh")){zh.classList.toggle("show");return}
  var row=t.closest(".row"); if(!row)return;
  playRows([row],null);
});
$("#stop").addEventListener("click",stopAll);
$("#manual-x").addEventListener("click",function(){$("#manual").hidden=true});
function setRate(r){rate=r;$("#r-slow").setAttribute("aria-pressed",r<1?"true":"false");$("#r-norm").setAttribute("aria-pressed",r<1?"false":"true");store.set("lo-rate",r<1?"slow":"norm")}
$("#r-slow").addEventListener("click",function(){setRate(0.7)});
$("#r-norm").addEventListener("click",function(){setRate(1)});
setRate(rate);
$("#hidezh").addEventListener("click",function(){
  var on=!document.body.classList.contains("hide-zh"); document.body.classList.toggle("hide-zh",on);
  this.setAttribute("aria-pressed",on?"true":"false"); this.textContent=on?"显示中文":"遮住中文";
});
showLesson(fromHash()||+store.get("lo-last")||LESSONS[0].n);
})();
</script>
