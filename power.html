async function open_(pw,quiet){
  var b=document.getElementById("b");b.disabled=true;b.textContent="解密中…";
  try{
    var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
